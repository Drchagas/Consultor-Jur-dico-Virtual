# Gate de testes do JARBAS.
#
# testpaths existe por um motivo concreto: `tools/` contém scripts
# OPERACIONAIS cujo nome começa com test_ (tools/test_claude.py, chamado pelo
# instalador e por scripts/CONFIGURAR_IA.ps1 para validar a chave da
# Anthropic). O pytest os coletava como suíte, e test_claude.py chama
# sys.exit(1) quando não há chave configurada — SystemExit durante a coleta
# derruba a execução inteira com INTERNALERROR e NENHUM teste roda.
#
# Resultado: `pytest -q`, que o CLAUDE.md manda rodar antes de cada commit,
# não reprovava nada porque nunca chegava a executar. O gate parecia existir
# e não existia. Renomear o script não é opção: o instalador o chama pelo nome.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
